<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POSTÔ · Teste interno do webhook</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08080C;color:#F5F0E8;font-family:'DM Sans',sans-serif;text-align:center;padding:24px}
.b{max-width:430px}.l{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:700}
button{display:block;width:100%;margin:12px 0;padding:16px;border-radius:12px;border:0;font-size:15px;font-weight:600;cursor:pointer}
.e{background:#7a2e2e;color:#F5F0E8}.v{background:#7A9E7E;color:#08080C}
#r{margin-top:18px;font-size:14px;line-height:1.5;opacity:.9;word-break:break-word}</style></head>
<body><div class="b"><div class="l">POSTÔ</div>
<p>Página interna de teste do webhook de vendas. Use e depois me avise para eu apagar.</p>
<button class="e" onclick="fire({teste_erro_proposital:true})">1 · Disparar ERRO de produção (deve acionar o workflow de erro)</button>
<button class="v" onclick="fire({event:'purchase_approved',customer:{name:'TESTE POSTÔ',email:'teste@postoproduz.com.br'},product:{name:'POSTÔ Essencial'},amount:697,transaction_id:'TESTE-'+Date.now()})">2 · Disparar VENDA de teste válida (deve gravar na aba Vendas e te mandar e-mail)</button>
<div id="r"></div>
<script>
async function fire(p){const r=document.getElementById('r');r.textContent='Enviando…';
try{const x=await fetch('https://posto.app.n8n.cloud/webhook/cakto-vendas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
r.textContent='Webhook respondeu HTTP '+x.status+'. Agora confira: Executions no n8n, a aba Vendas e o seu e-mail.';}
catch(e){r.textContent='Falhou no navegador: '+e.message;}}
</script></div></body></html>
